name: Daily portfolio checks
on:
  schedule:
    - cron: '17 9 * * *'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-portfolio-checks
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate project and generate an honest maintenance report
        run: |
          python - <<'PY'
          import datetime, hashlib, importlib.util, json, os, pathlib, subprocess, sys, tempfile, zipfile
          from html.parser import HTMLParser
          root = pathlib.Path.cwd()
          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids = set(); self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs: self.ids.add(attrs['id'])
                  if tag == 'a': self.links.append(attrs.get('href', ''))
          page = PageCheck(); page.feed((root / 'index.html').read_text())
          assert {'work', 'demo', 'contact', 'market', 'coverage'} <= page.ids
          for link in page.links:
              if link.startswith('#') and link != '#': assert link[1:] in page.ids
              if link and not link.startswith(('#', 'http:', 'https:', 'mailto:')):
                  assert (root / link).is_file(), f'Missing local asset: {link}'
          archive = root / 'carrier-priority-demo.zip'
          with tempfile.TemporaryDirectory() as directory:
              destination = pathlib.Path(directory).resolve()
              with zipfile.ZipFile(archive) as package:
                  for info in package.infolist():
                      assert (destination / info.filename).resolve().is_relative_to(destination)
                  package.extractall(destination)
              project = destination / 'routescope-analytics'
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], cwd=project, check=True)
              spec = importlib.util.spec_from_file_location('pipeline', project / 'pipeline.py')
              module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
              scenario_count = 0
              for percent in range(10, 101, 5):
                  rows, rejected = module.run(output=project / 'output', target=percent / 100)
                  assert len(rejected) == 2
                  routes = {(r['origin'], r['destination']) for r in rows}
                  for route in routes:
                      selected = [r for r in rows if (r['origin'], r['destination']) == route and r['selected']]
                      assert sum(r['market_share'] for r in selected) >= percent / 100 - 1e-12
                      assert sum(r['market_share'] for r in selected[:-1]) < percent / 100 - 1e-12
                      scenario_count += 1
          checked = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report = f'''# Automated Portfolio Maintenance

          Latest successful validation: {checked}

          This report is generated by GitHub Actions. It records automated maintenance, not personal coding activity.

          - Website sections, internal anchors, and local assets: passed.
          - RouteScope packaged unit tests: passed.
          - Route/coverage scenarios: {scenario_count} passed.
          - Source checked: `{os.environ['GITHUB_SHA']}`.
          - Project archive SHA-256: `{hashlib.sha256(archive.read_bytes()).hexdigest()}`.
          - [View the actual workflow run]({run_url}).

          Schedule: daily at 09:17 America/New_York. GitHub may delay scheduled runs.
          Existing commits retain their real dates. Report commits are attributed to the automation bot.
          '''
          (root / 'ACTIVITY.md').write_text(report)
          print(report)
          PY
      - name: Commit only the generated maintenance report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ACTIVITY.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record successful automated portfolio validation'
            git push
          fi
